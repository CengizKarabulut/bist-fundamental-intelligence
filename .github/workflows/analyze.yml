name: Hisse Analizi

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "BIST hisse kodu (örn. ASELS)"
        required: true
        default: "ASELS"
        type: string
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      KAP_API_KEY: ${{ secrets.KAP_API_KEY }}
      KAP_API_FINANCIALS_URL_TEMPLATE: ${{ secrets.KAP_API_FINANCIALS_URL_TEMPLATE }}
      KAP_API_KEY_HEADER: ${{ vars.KAP_API_KEY_HEADER || 'X-API-Key' }}

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Hisse raporunu oluştur
        env:
          SYMBOL: ${{ github.event.inputs.symbol || 'ASELS' }}
        run: python analyze.py "$SYMBOL"

      - name: Raporu artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: bist-report-${{ github.event.inputs.symbol || 'ASELS' }}
          path: |
            reports/*.html
            reports/*.json
            reports/*.csv
          if-no-files-found: error
          retention-days: 14
