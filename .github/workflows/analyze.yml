name: Hisse Analizi

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "BIST hisse kodu (örn. ASELS)"
        required: true
        default: "ASELS"
        type: string
  push:
    branches: [main]
    paths:
      - "analyze.py"
      - "history_engine.py"
      - "requirements.txt"
      - ".github/workflows/analyze.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Hisse raporunu oluştur
        env:
          SYMBOL: ${{ github.event.inputs.symbol || 'ASELS' }}
        run: python analyze.py "$SYMBOL"

      - name: Raporu artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: bist-report-${{ github.event.inputs.symbol || 'ASELS' }}
          path: |
            reports/*.html
            reports/*.json
            reports/*.csv
          if-no-files-found: error
          retention-days: 14
