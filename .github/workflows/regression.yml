name: Regression Smoke Test
# bank-profile coverage

on:
  push:
    branches: [main]
    paths:
      - "analyze.py"
      - "history_engine.py"
      - "special_profiles.py"
      - "data/nav_inputs.csv"
      - "regression_checks.py"
      - "requirements.txt"
      - "version.py"
      - "VERSION"
      - ".github/workflows/regression.yml"
  workflow_dispatch:

concurrency:
  group: regression-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Python sözdizimi kontrolü
        run: python -m py_compile analyze.py history_engine.py special_profiles.py regression_checks.py version.py

      - name: Muhasebe hesaplama güvenlik testleri
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: ASELS sanayi/savunma testi
        run: timeout 240s python analyze.py ASELS

      - name: AKBNK banka/UFRS testi
        run: timeout 240s python analyze.py AKBNK

      - name: ALBRK katılım bankası testi
        run: timeout 240s python analyze.py ALBRK

      - name: EKGYO GYO/NAD testi
        run: timeout 240s python analyze.py EKGYO

      - name: KCHOL holding/NAD-gate testi
        run: timeout 240s python analyze.py KCHOL

      - name: AGESA sigorta/UFRS testi
        run: timeout 240s python analyze.py AGESA

      - name: GLBMD desteklenen finansal/UFRS testi
        run: timeout 240s python analyze.py GLBMD

      - name: ISFIN veri-yoksa graceful fallback testi
        run: timeout 240s python analyze.py ISFIN

      - name: Semantik rapor kontrolleri
        run: python regression_checks.py

      - name: Regresyon raporlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: |
            reports/*.html
            reports/*.json
            reports/*.csv
          if-no-files-found: error
          retention-days: 7
