name: Full BIST Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "analyze.py"
      - "history_engine.py"
      - "statement_reconciliation.py"
      - "statement_metrics.py"
      - "statement_peers.py"
      - "audit_readiness.py"
      - "tests/**"
      - "special_profiles.py"
      - "data/nav_inputs.csv"
      - "audit_all.py"
      - "audit_merge.py"
      - "requirements.txt"
      - "quality_gate.py"
      - "version.py"
      - "VERSION"
      - ".github/workflows/full_bist_audit.yml"

concurrency:
  group: full-bist-audit-main
  cancel-in-progress: true

jobs:
  audit:
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt
      - name: Sözdizimi kontrolü
        run: python -m py_compile statement_metrics.py statement_peers.py analyze.py history_engine.py special_profiles.py audit_all.py audit_merge.py
      - name: Muhasebe ve audit statü testleri
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Tüm BIST shard audit
        run: python audit_all.py --shard-index ${{ matrix.shard }} --shard-count 8 --quarterly 8 --symbol-timeout 45
      - name: Shard sonucunu yükle
        uses: actions/upload-artifact@v4
        with:
          name: bist-audit-shard-${{ matrix.shard }}
          path: audit_results/*
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge bağımlılıkları
        run: pip install "pandas>=2.2,<3.0"
      - name: Shard artifactlarını indir
        uses: actions/download-artifact@v4
        with:
          pattern: bist-audit-shard-*
          path: audit_downloads
          merge-multiple: false
      - name: Audit hazırlık statüsü modülünü doğrula
        run: python -m py_compile audit_readiness.py audit_merge.py statement_peers.py
      - name: Sonuçları birleştir
        run: python audit_merge.py
      - name: Release quality gate
        run: python quality_gate.py --summary audit_summary/full_bist_audit_summary.json
      - name: Bağımsız BIST sektör emsal önbelleğini yayımla
        # Publish only after complete 8/8 shards and a passing release gate.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          cp audit_summary/statement_peer_snapshot.csv data/statement_peer_snapshot.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/statement_peer_snapshot.csv
          if git diff --cached --quiet; then
            echo "Emsal verisinde değişiklik yok."
          else
            git commit -m "Refresh statement-based BIST peer medians [skip ci]"
            git push origin HEAD:main
          fi
      - name: Denetim sonucunu Actions özetinde göster
        if: always()
        shell: bash
        run: |
          {
            echo "## BIST Fundamental Intelligence — Release Gate"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            if [ -f audit_summary/full_bist_audit.md ]; then
              cat audit_summary/full_bist_audit.md
            else
              echo "Tam audit özeti oluşturulamadı. Shard ve merge adımlarını inceleyin."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Full audit raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-bist-audit
          path: audit_summary/*
          if-no-files-found: error
          retention-days: 14
